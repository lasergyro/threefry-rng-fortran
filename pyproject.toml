[build-system]
# numpy: setup.py runs fortran2numba, which reads the Fortran with numpy.f2py
requires = ["setuptools>=77", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "threefry-rng"
version = "0.1.0"
description = "Threefry-2x32 counter-based pseudorandom function in portable Fortran 95 with Numba wrappers"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Amaral" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2", "numba>=0.68.0"]

[tool.setuptools]
package-dir = { "" = "build" }
packages = ["threefry", "rand_mod"]

[tool.setuptools.package-data]
"*" = ["*.so", "*.pyi", "py.typed"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.10"
numpy = ">=2"
pytest = "*"
numba = ">=0.68.0,<0.69"
pip = ">=26.2.1,<27"
setuptools = ">=84.0.0,<85"
findent = ">=4.4.1,<5"
ruff = ">=0.17.0,<0.18"

[tool.pixi.pypi-dependencies]
fortitude-lint = ">=0.9.2,<0.10" # not on conda-forge for osx-arm64

# findent flags for pixi run fmt / fmt-diff, matching the existing style: 2-space
# indent, case indented 2, continuation lines left as aligned by hand.
[tool.pixi.activation.env]
FINDENT_FLAGS = "-i2 -k- -c2"

[tool.pixi.tasks]
build = "python -c \"import fortran2numba as f; f.make_module('threefry', ('src/threefry_mod.f90',)); f.make_module('rand_mod', ('examples/rand_mod.f90',), deps=('src/threefry_mod.f90',))\""
test = { cmd = "pytest tests/python", env = { PYTHONPATH = "build" }, depends-on = [
    "build",
] }
# both always run, so one tool's findings don't hide the other's
lint = '''bash -c 'rc=0; fortitude check || rc=1; ruff check || rc=1; exit $rc' '''
# Fortran with findent; tracked Markdown with sembr (one sentence per line, a
# personal tool) only where it is installed, else silently skipped.
fmt = '''bash -c 'wfindent $FINDENT_FLAGS "$@" || exit 1; if command -v sembr > /dev/null; then sembr $(git ls-files "*.md"); fi' _ src/*.f90 examples/*.f90 tests/*.f90 tests/bench/*.f90 tests/empirical/*.f90'''
# exits 1 if any file would change
fmt-diff = '''bash -c 'rc=0; for f in "$@"; do findent $FINDENT_FLAGS < "$f" | diff -u --label "a/$f" --label "b/$f" "$f" - || rc=1; done; if command -v sembr > /dev/null; then sembr --check $(git ls-files "*.md") || rc=1; fi; exit $rc' _ src/*.f90 examples/*.f90 tests/*.f90 tests/bench/*.f90 tests/empirical/*.f90'''
# gfortran warnings: the core and example as Fortran 95 (-pedantic), the test
# programs as Fortran 2008. Prints nothing when clean (the lint hook relies on it).
warn = """bash -c 'set -e; mkdir -p build/warn; w="-Wall -Wextra -J build/warn -c -o /dev/null"
for f in src/*.f90 examples/*.f90; do gfortran -std=f95 -pedantic $w "$f"; done
for f in tests/*.f90 tests/*/*.f90; do gfortran -std=f2008 $w "$f"; done'"""
